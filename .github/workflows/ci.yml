name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: 분석 · 테스트 · 웹 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      # 실제 키 없이 목 백엔드로 빌드가 되는지만 확인한다.
      # 시크릿을 CI에 넣지 않아도 컴파일 회귀를 잡을 수 있다.
      - name: 웹 빌드 (목 백엔드)
        run: flutter build web --release --dart-define=FORCE_MOCK=true

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  sql:
    name: 마이그레이션 문법 검사
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 로컬 스택을 띄워 마이그레이션과 시드가 실제로 적용되는지 확인한다.
      # RLS 정책 오타는 여기서 잡힌다.
      - name: 로컬 Supabase 기동
        run: supabase start

      - name: 마이그레이션 적용 확인
        run: supabase db reset --no-seed

      - name: 시드 적용 확인
        run: supabase db reset
